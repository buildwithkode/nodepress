name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# This is an npm-workspaces monorepo: every job installs from the ROOT
# package-lock.json (`npm ci` at the repo root), exactly like a developer
# machine. The per-workspace lockfiles are only used by the Docker builds and
# are checked separately (hygiene + docker jobs).

jobs:
  # ── Backend: type-check + unit tests ──────────────────────────────────────
  backend-unit:
    name: Backend (type-check · unit tests · coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/nodepress_test
      DIRECT_URL:   postgresql://postgres:testpassword@localhost:5432/nodepress_test
      JWT_SECRET:   ci_test_secret_not_used_in_production_64chars_xxxxxxxxxxxxx
      CORS_ORIGIN:  http://localhost:3000
      NODE_ENV:     test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (root workspace lockfile)
        run: npm ci

      - name: Type-check
        working-directory: backend
        run: npx tsc --noEmit

      - name: Unit tests with coverage thresholds
        working-directory: backend
        run: npm run test:cov -- --forceExit

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 14

  # ── Backend: e2e tests (real Postgres + Redis) ────────────────────────────
  backend-e2e:
    name: Backend (e2e tests · schema drift)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB:       nodepress_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL:   postgresql://postgres:testpassword@localhost:5432/nodepress_test
      DIRECT_URL:     postgresql://postgres:testpassword@localhost:5432/nodepress_test
      REDIS_URL:      redis://localhost:6379
      JWT_SECRET:     ci_test_secret_not_used_in_production_64chars_xxxxxxxxxxxxx
      CORS_ORIGIN:    http://localhost:3000
      NODE_ENV:       test
      STORAGE_DRIVER: local

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (root workspace lockfile)
        run: npm ci

      - name: Apply migrations
        working-directory: backend
        run: npx prisma migrate deploy

      # Migrations must fully describe schema.prisma (db push hides drift).
      - name: Schema drift check
        working-directory: backend
        run: |
          PGPASSWORD=testpassword psql -h localhost -U postgres -c 'CREATE DATABASE nodepress_shadow'
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://postgres:testpassword@localhost:5432/nodepress_shadow \
            --exit-code

      - name: E2E tests
        working-directory: backend
        run: npm run test:e2e

  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (type-check · build)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (root workspace lockfile)
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        env:
          BACKEND_URL: http://backend:3000
        run: npm run build

  # ── CLI ───────────────────────────────────────────────────────────────────
  cli:
    name: CLI (syntax check)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: |
          for f in cli/bin/*.js cli/src/*.js; do node --check "$f"; done

      - name: Version check
        run: node cli/bin/nodepress.js --version

  # ── Repo hygiene ──────────────────────────────────────────────────────────
  # Problems no test catches: vulnerable runtime dependencies (backend AND
  # frontend), Docker lockfiles drifting from package.json, and the repo
  # disagreeing with itself about its version.
  hygiene:
    name: Hygiene (prod audit · Docker lockfiles · licences · versions)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Production dependency audit (all workspaces)
        run: npm audit --omit=dev --audit-level=high

      - name: Docker lockfiles install and are clean
        run: scripts/check-docker-lockfiles.sh

      - name: Production dependency licences
        run: |
          npm ci --ignore-scripts
          node scripts/check-licenses.js

      - name: Version consistency
        run: node scripts/check-versions.js

  # ── Runtime smoke ─────────────────────────────────────────────────────────
  # Boots the built backend against a real database and exercises the API.
  # Unit tests and tsc both pass over an application that cannot start — that
  # happened on the NestJS 11 upgrade.
  smoke:
    name: Runtime smoke (boots the app, hits the real API)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB:       nodepress_smoke
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/nodepress_smoke
      DIRECT_URL:   postgresql://postgres:testpassword@localhost:5432/nodepress_smoke
      SMOKE_PORT:   "3999"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # --no-scaffold skips the CLI/GitHub-clone layer (network-bound, covered
      # by the cli job); --smoke runs the build + runtime layers.
      - name: Build and smoke test
        run: ./scripts/validate.sh --no-scaffold --smoke

      - name: Backend log on failure
        if: failure()
        run: cat /tmp/np-validate-be.log || true

  # ── Docker images ─────────────────────────────────────────────────────────
  # Builds both production images exactly as `docker compose build` does
  # (per-workspace context and lockfile). Nothing is pushed.
  docker:
    name: Docker (build backend + frontend images)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          build-args: BACKEND_URL=http://backend:3000
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
