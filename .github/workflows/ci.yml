name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend: type-check + unit tests ──────────────────────────────────────
  backend-unit:
    name: Backend (type-check · unit tests)
    runs-on: ubuntu-latest

    env:
      DATABASE_URL:   postgresql://postgres:testpassword@localhost:5432/nodepress_test
      DIRECT_URL:     postgresql://postgres:testpassword@localhost:5432/nodepress_test
      JWT_SECRET:     ci_test_secret_not_used_in_production_64chars_xxxxxxxxxxxxx
      CORS_ORIGIN:    http://localhost:3000
      NODE_ENV:       test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Type-check
        working-directory: backend
        run: npx tsc --noEmit

      - name: Unit tests (with coverage)
        working-directory: backend
        run: npm run test:cov -- --passWithNoTests --forceExit

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: coverage/
          retention-days: 30

  # ── Backend: e2e tests (needs real Postgres + Redis) ──────────────────────
  backend-e2e:
    name: Backend (e2e tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB:       nodepress_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL:   postgresql://postgres:testpassword@localhost:5432/nodepress_test
      DIRECT_URL:     postgresql://postgres:testpassword@localhost:5432/nodepress_test
      REDIS_URL:      redis://localhost:6379
      JWT_SECRET:     ci_test_secret_not_used_in_production_64chars_xxxxxxxxxxxxx
      CORS_ORIGIN:    http://localhost:3000
      NODE_ENV:       test
      STORAGE_DRIVER: local

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run Prisma migrations
        working-directory: backend
        run: npx prisma migrate deploy

      - name: E2E tests
        working-directory: backend
        run: npm run test:e2e

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (type-check · build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        env:
          BACKEND_URL: http://localhost:4000
          NEXT_PUBLIC_API_URL: http://localhost:4000
        run: npm run build

  # ── CLI ────────────────────────────────────────────────────────────────────
  cli:
    name: CLI (syntax check)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: node --check cli/bin/nodepress.js && node --check cli/src/new.js

      - name: Version check
        run: node cli/bin/nodepress.js --version

  # ── Repo hygiene ───────────────────────────────────────────────────────────
  # Two classes of problem that no test catches and no diff makes obvious:
  # a vulnerable production dependency, and the repo disagreeing with itself
  # about its own version. Both reached `main` before and sat there for months.
  hygiene:
    name: Hygiene (prod audit · version consistency)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # Runtime dependencies only — dev-only advisories are noise for a CMS
      # people self-host. Fails the build on high or critical.
      - name: Production dependency audit
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

      - name: Version consistency
        run: node scripts/check-versions.js

  # ── Runtime smoke ──────────────────────────────────────────────────────────
  # Boots the built backend against a real database and exercises the API.
  # Unit tests and tsc both pass over an application that cannot start — that
  # happened on the NestJS 11 upgrade, where a missing Apollo/Express 5 adapter
  # killed the app during bootstrap while all 245 tests stayed green.
  smoke:
    name: Runtime smoke (boots the app, hits the real API)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB:       nodepress_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/nodepress_smoke
      DIRECT_URL:   postgresql://postgres:testpassword@localhost:5432/nodepress_smoke
      SMOKE_PORT:   "3999"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # --no-scaffold skips the CLI/GitHub-clone layer (slow, network-bound and
      # already covered by the cli job); --smoke runs the build + runtime layers.
      - name: Build and smoke test
        run: ./scripts/validate.sh --no-scaffold --smoke

      - name: Backend log on failure
        if: failure()
        run: cat /tmp/np-validate-be.log || true
