# NodePress — Docker Compose (One-Click & Production Deployment)
# Usage: docker compose up -d --build
#
# No .env is required: JWT_SECRET and the database password are generated on the
# first `up` by the secrets-init service. Set them in .env only to use your own.

services:
  # ── First-boot secrets ──────────────────────────────────────────────────────
  # Generates JWT_SECRET and the DB password into the secrets_data volume on the
  # first `up` (or writes through values set in .env). See scripts/docker-secrets-init.sh.
  secrets-init:
    image: postgres:16-alpine
    container_name: nodepress_secrets_init
    entrypoint: ["sh", "/secrets-init.sh"]
    environment:
      JWT_SECRET:  ${JWT_SECRET:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
    volumes:
      - ./scripts/docker-secrets-init.sh:/secrets-init.sh:ro
      - secrets_data:/secrets
      - postgres_data:/pgdata:ro
    restart: "no"
    networks:
      - nodepress-net

  # ── PostgreSQL Database ─────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: nodepress_db
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB:            ${POSTGRES_DB:-nodepress}
      POSTGRES_USER:          ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/nodepress-secrets/db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - secrets_data:/run/nodepress-secrets:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nodepress-net

  # ── Redis Cache ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nodepress_redis
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nodepress-net

  # ── NestJS Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nodepress_backend
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # DATABASE_URL, DIRECT_URL and JWT_SECRET are assembled from the
      # secrets_data volume in `command` below — never hardcode them here.
      POSTGRES_DB:   ${POSTGRES_DB:-nodepress}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      PORT:          3000
      NODE_ENV:      production
      CORS_ORIGIN:   ${CORS_ORIGIN:-${SITE_URL:-http://localhost}}
      APP_URL:       ${APP_URL:-http://localhost/api}
      SITE_URL:      ${SITE_URL:-http://localhost}
      REDIS_URL:     redis://redis:6379
    volumes:
      - uploads_data:/app/uploads
      - secrets_data:/run/nodepress-secrets:ro
    restart: unless-stopped
    networks:
      - nodepress-net
    command:
      - sh
      - -c
      - |
        export JWT_SECRET="$$(cat /run/nodepress-secrets/jwt_secret)"
        export DATABASE_URL="postgresql://$${POSTGRES_USER}:$$(cat /run/nodepress-secrets/db_password)@db:5432/$${POSTGRES_DB}"
        export DIRECT_URL="$$DATABASE_URL"
        npx prisma migrate deploy && exec node dist/main.js

  # ── Next.js Frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:3000
    container_name: nodepress_frontend
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:3000
      PORT: 3001
    restart: unless-stopped
    networks:
      - nodepress-net

  # ── Nginx Reverse Proxy ──────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: nodepress_nginx
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy.conf:/etc/nginx/snippets/nodepress-proxy.conf:ro
    restart: unless-stopped
    networks:
      - nodepress-net

networks:
  nodepress-net:
    driver: bridge

volumes:
  secrets_data:
  postgres_data:
  redis_data:
  uploads_data:
