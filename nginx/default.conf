# ── NodePress nginx reverse proxy ─────────────────────────────────────────────
# Gzip compression
gzip on;
gzip_vary on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
gzip_min_length 1024;

# ── Upstreams ─────────────────────────────────────────────────────────────────
# `backend` resolves to every replica when scaled (docker compose up --scale
# backend=3). nginx resolves it at startup, so restart nginx after changing the
# replica count: docker compose restart nginx
upstream nodepress_backend {
    server backend:3000;
    keepalive 32;
}

# Realtime pins each client IP to one replica (ip_hash). WebSocket connections
# are single long-lived requests and don't need it, but Socket.io's long-polling
# fallback sends many requests that must all reach the replica holding the session.
upstream nodepress_realtime {
    ip_hash;
    server backend:3000;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=upload:10m rate=10r/m;

# ── HTTP (listens on port 80 for any hostname / IP) ───────────────────────────
server {
    listen 80;
    server_name _ YOUR_DOMAIN www.YOUR_DOMAIN;

    include /etc/nginx/snippets/nodepress-proxy.conf;
}

