# Shared proxy rules — included by both HTTP and HTTPS server blocks.
# Mounted outside conf.d/ (at /etc/nginx/snippets/) on purpose: nginx loads every
# conf.d/*.conf at the http level, where these location blocks are not allowed.

client_max_body_size 50M;  # Allows media uploads up to 50MB

# ── Block external access to internal Prometheus metrics endpoint ────────────
location = /api/metrics {
    deny all;
    return 403;
}

# ── WebSocket (Socket.IO realtime gateway) ────────────────────────────────────
location /api/realtime {
    proxy_pass         http://nodepress_realtime/api/realtime;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
}

# ── Next.js draft-mode route handlers (frontend/app/api/*) ───────────────────
# Must win over the /api/ backend block below, or live preview 404s.
location ~ ^/api/(draft|disable-draft)$ {
    proxy_pass         http://frontend:3001;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

# ── API requests → NestJS backend ─────────────────────────────────────────────
location /api/ {
    limit_req zone=api burst=30 nodelay;

    proxy_pass         http://nodepress_backend/api/;
    proxy_http_version 1.1;
    proxy_set_header   Connection        "";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# ── Upload endpoint ───────────────────────────────────────────────────────────
location /api/media/upload {
    limit_req zone=upload burst=10 nodelay;

    proxy_pass         http://nodepress_backend/api/media/upload;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

# ── Uploaded files — served from backend uploads directory ───────────────────
location /uploads/ {
    proxy_pass         http://nodepress_backend/uploads/;
    proxy_cache_valid  200 7d;
    add_header         Cache-Control "public, max-age=604800, immutable";
    proxy_set_header   Host $host;
}

# ── GraphQL ───────────────────────────────────────────────────────────────────
location /graphql {
    proxy_pass         http://nodepress_backend/graphql;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

# ── Swagger UI docs ───────────────────────────────────────────────────────────
location /api-docs {
    proxy_pass         http://nodepress_backend/api-docs;
    proxy_set_header   Host $host;
}

# ── Sitemap / robots ──────────────────────────────────────────────────────────
location ~ ^/(sitemap\.xml|robots\.txt)$ {
    proxy_pass         http://nodepress_backend/api/$1;
    proxy_set_header   Host $host;
    add_header         Cache-Control "public, max-age=3600";
}

# ── Everything else → Next.js frontend ───────────────────────────────────────
location / {
    proxy_pass         http://frontend:3001;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# ── Security headers ──────────────────────────────────────────────────────────
add_header X-Frame-Options          "SAMEORIGIN"   always;
add_header X-Content-Type-Options   "nosniff"      always;
add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;
