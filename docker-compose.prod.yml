# NodePress — Production Docker Compose
# Usage:
#   docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d
#   (add --build to `up` to build from this checkout instead of pulling release images)
# Set NODEPRESS_VERSION in .env to the release to run, e.g. 1.8.0.
#
# Required .env variables (auto-generated by: npx nodepress new <name>):
#   DB_PASSWORD, JWT_SECRET, SITE_URL, CORS_ORIGIN

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: nodepress_db
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-nodepress}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512m

  # ── Redis (query-result cache) ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nodepress_redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 288m

  # ── PgBouncer (connection pooler) ───────────────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:1.23.1
    container_name: nodepress_pgbouncer
    environment:
      DB_HOST:     db
      DB_PORT:     5432
      DB_USER:     ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      DB_NAME:     ${POSTGRES_DB:-nodepress}
      POOL_MODE:   transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 64m

  # ── NestJS Backend ──────────────────────────────────────────────────────────
  # ── Migrations (one-off) ──────────────────────────────────────────────────
  # Runs `prisma migrate deploy` once per `up`, before any backend replica
  # starts, over a direct (non-PgBouncer) connection — DDL can't go through
  # transaction pooling, and N replicas shouldn't race to migrate.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${NODEPRESS_IMAGE_PREFIX:-ghcr.io/buildwithkode}/nodepress-backend:${NODEPRESS_VERSION:-latest}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${DB_PASSWORD:?DB_PASSWORD must be set in .env}@db:5432/${POSTGRES_DB:-nodepress}"
      DIRECT_URL:   "postgresql://${POSTGRES_USER:-postgres}:${DB_PASSWORD:?DB_PASSWORD must be set in .env}@db:5432/${POSTGRES_DB:-nodepress}"
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"
    networks:
      - internal

  # Scale horizontally with: docker compose -f docker-compose.prod.yml up -d --scale backend=3
  # (no container_name, so replicas can coexist; Redis keeps cache, rate limits
  # and realtime in sync across them — use STORAGE_DRIVER=s3 for uploads).
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${NODEPRESS_IMAGE_PREFIX:-ghcr.io/buildwithkode}/nodepress-backend:${NODEPRESS_VERSION:-latest}
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Route through PgBouncer for pooled connections. pgbouncer=true is required
      # in transaction pooling mode (disables Prisma's prepared statements, which
      # otherwise fail with "prepared statement already exists" under load).
      DATABASE_URL:  "postgresql://${POSTGRES_USER:-postgres}:${DB_PASSWORD:?DB_PASSWORD must be set in .env}@pgbouncer:5432/${POSTGRES_DB:-nodepress}?pgbouncer=true&connection_limit=${DB_POOL_SIZE:-10}"
      # Use direct DB connection for migrations (PgBouncer transaction mode blocks DDL)
      DIRECT_URL:    "postgresql://${POSTGRES_USER:-postgres}:${DB_PASSWORD:?DB_PASSWORD must be set in .env}@db:5432/${POSTGRES_DB:-nodepress}"
      PORT:          3000
      JWT_SECRET:    ${JWT_SECRET:?JWT_SECRET must be set in .env (openssl rand -hex 48)}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN:   ${CORS_ORIGIN:-http://localhost}
      APP_URL:       ${APP_URL:-http://localhost:3000}
      SITE_URL:      ${SITE_URL:-http://localhost}
      REDIS_URL:     redis://redis:6379
      # Storage (uncomment for S3):
      # STORAGE_DRIVER:         s3
      # STORAGE_S3_BUCKET:      ${STORAGE_S3_BUCKET}
      # STORAGE_S3_REGION:      ${STORAGE_S3_REGION}
      # STORAGE_S3_ACCESS_KEY:  ${STORAGE_S3_ACCESS_KEY}
      # STORAGE_S3_SECRET_KEY:  ${STORAGE_S3_SECRET_KEY}
      # STORAGE_S3_ENDPOINT:    ${STORAGE_S3_ENDPOINT}
      # STORAGE_S3_PUBLIC_URL:  ${STORAGE_S3_PUBLIC_URL}
      # Email — required in production for password reset and team invitations.
      # Pick a provider: Gmail, Resend (resend.com), or SendGrid (sendgrid.com).
      # SMTP_HOST: ${SMTP_HOST}
      # SMTP_PORT: ${SMTP_PORT:-587}
      # SMTP_USER: ${SMTP_USER}
      # SMTP_PASS: ${SMTP_PASS}
      # SMTP_FROM: ${SMTP_FROM}
      # Metrics auth — protects GET /api/metrics (recommended in production):
      # METRICS_TOKEN: ${METRICS_TOKEN}
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'

  # ── Next.js Frontend ─────────────────────────────────────────────────────────
  frontend:
    image: ${NODEPRESS_IMAGE_PREFIX:-ghcr.io/buildwithkode}/nodepress-frontend:${NODEPRESS_VERSION:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:3000
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:3000
    restart: unless-stopped
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 256m

  # ── nginx reverse proxy ──────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: nodepress_nginx
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy.conf:/etc/nginx/snippets/nodepress-proxy.conf:ro
      # SSL certificates (mount after running certbot):
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped
    networks:
      - internal
      - external
    deploy:
      resources:
        limits:
          memory: 64m

  # ── Prometheus (metrics collection) ──────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: nodepress_prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 256m

  # ── Grafana (metrics visualisation) ──────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: nodepress_grafana
    environment:
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP:     false
      GF_SERVER_ROOT_URL:         "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 256m

  # ── Automated backups ─────────────────────────────────────────────────────────
  backup:
    image: postgres:16-alpine
    container_name: nodepress_backup
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD:   ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_HOST: db
      POSTGRES_DB:   ${POSTGRES_DB:-nodepress}
      # Optional: set to upload backups to S3
      # BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET}
      # AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      # AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      # AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
      - ./scripts/backup-crontab:/etc/crontabs/root:ro
    entrypoint: ["sh", "-c", "chmod +x /backup.sh && crond -f -l 8"]
    command: []
    networks:
      - internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64m

networks:
  internal:
    driver: bridge
  external:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  uploads:
  backups:
